# CI: the same checks as the Makefile (lint, typecheck, test, build) plus the Docker image.
# Job ids are stable: the deploy jobs (#11, #28) depend on them by name.
# On push to main: `deploy-dev` ships the commit to the dev service once every other job passes, then
# `deploy-prod` waits for a manual approval (GitHub environment `production`) and ships the same
# commit to prod.
name: CI

on:
  pull_request:
  push:
    branches: [main]

# A pull request cancels its older runs. A push to main gets its own group (its SHA), so a run whose
# deploy-prod waits for approval never holds back or cancels the CI and dev deploy of newer pushes;
# the deploy jobs serialize themselves with job-level groups.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  UV_PYTHON_DOWNLOADS: automatic

jobs:
  backend:
    name: backend (lint, mypy, unit + API tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3 # setup-uv publishes no floating major tag
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - run: uv sync --locked
      - name: ruff lint
        run: uv run ruff check .
      - name: ruff format check
        run: uv run ruff format --check .
      - name: mypy
        run: uv run mypy
      - name: unit tests
        run: uv run pytest -q tests/unit
      - name: API tests
        run: uv run pytest -q tests/api

  frontend:
    name: frontend (typecheck, test, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: typecheck
        run: npm run typecheck
      - name: tests
        run: npm test
      - name: build
        run: npm run build

  integration:
    name: integration (PostgreSQL 16)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: tracker
          POSTGRES_PASSWORD: tracker
          POSTGRES_DB: tracker_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tracker -d tracker_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql+psycopg://tracker:tracker@localhost:5432/tracker_test
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3 # setup-uv publishes no floating major tag
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - run: uv sync --locked
      - name: integration tests
        run: uv run pytest -q tests/integration

  scripts:
    name: scripts (responder tests, shellcheck, actionlint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: responder and Smoke script tests
        run: scripts/responder/tests/run.sh
      - name: shellcheck
        run: shellcheck scripts/*.sh scripts/responder/*.sh scripts/responder/tests/run.sh scripts/responder/tests/fake-gh
      - name: actionlint
        run: docker run --rm -v "$PWD:/repo" -w /repo rhysd/actionlint:1.7.12 -color

  docker:
    name: docker (image build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: build image
        run: docker build --tag application-tracker:ci .

  deploy-dev:
    name: deploy-dev (Render)
    # Only a push to main deploys, and only after every CI job above has passed (AC-11.3, AC-28.2).
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [backend, frontend, integration, scripts, docker]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Dev has its own group, apart from prod and Rollback: a dev deploy never waits for a prod
    # approval, and a newer push's dev deploy is never blocked by an older commit awaiting approval.
    concurrency:
      group: deploy-render-dev
      cancel-in-progress: false
    env:
      # Set by the owner (README, "Dev and prod"); never written into the repo.
      DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEV_DEPLOY_HOOK_URL }}
      APP_URL: ${{ vars.DEV_APP_URL }}
    steps:
      # Without the dev settings the job ends green, so deploy-prod is still offered (AC-28.3).
      - name: check dev deploy settings
        id: settings
        run: |
          if [ -z "$DEPLOY_HOOK_URL" ] || [ -z "$APP_URL" ]; then
            echo "::notice title=Dev deploy skipped::The dev environment isn't configured yet: add the RENDER_DEV_DEPLOY_HOOK_URL secret and the DEV_APP_URL variable (README, Dev and prod)."
            echo "configured=false" >> "$GITHUB_OUTPUT"
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v7
        if: steps.settings.outputs.configured == 'true'

      # Calls the dev hook with ref=<this commit>, then polls the dev /health until it reports this
      # commit (up to 10 minutes).
      - name: deploy this commit to dev and wait for /health
        if: steps.settings.outputs.configured == 'true'
        run: scripts/render-deploy.sh "$GITHUB_SHA"

  deploy-prod:
    name: deploy-prod (Render)
    # `!cancelled()` replaces the implicit success(), so a skipped dependency doesn't skip this job.
    # It runs when (AC-28.4): the event is a push to main (deploy-dev is also skipped on pull
    # requests, so this check is needed), every CI job succeeded (a failed test job means no prod
    # deploy even when dev is skipped), and deploy-dev succeeded or was skipped (dev not configured).
    # A failed or cancelled deploy-dev means no prod deploy.
    if: >-
      ${{ !cancelled()
      && github.event_name == 'push' && github.ref == 'refs/heads/main'
      && needs.backend.result == 'success'
      && needs.frontend.result == 'success'
      && needs.integration.result == 'success'
      && needs.scripts.result == 'success'
      && needs.docker.result == 'success'
      && (needs.deploy-dev.result == 'success' || needs.deploy-dev.result == 'skipped') }}
    needs: [backend, frontend, integration, scripts, docker, deploy-dev]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Required reviewers on this environment make the job wait for approval. The owner must create
    # it with a reviewer BEFORE this job first runs: GitHub creates a missing environment without
    # protection rules, and prod would deploy unapproved (README, "Dev and prod"). The workflow
    # can't check this: GITHUB_TOKEN has no scope to read an environment's protection rules.
    environment: production
    # Same group as Rollback (#27), so a prod deploy and a rollback never run at once. Prod always
    # deploys the SHA of the run that was approved. How GitHub orders a run that waits for approval
    # against a newer run in this group is not confirmed by its docs; AC-28.7 checks it with two
    # pushes (see the README). Dev has its own group and isn't affected.
    concurrency:
      group: deploy-render
      cancel-in-progress: false
    env:
      # Set by the owner (README, "Deployment"); never written into the repo (AC-11.2).
      DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
      APP_URL: ${{ vars.APP_URL }}
    steps:
      - name: check deploy settings
        id: settings
        run: |
          if [ -z "$DEPLOY_HOOK_URL" ] || [ -z "$APP_URL" ]; then
            echo "::notice title=Deploy skipped::Deployment isn't configured yet: add the RENDER_DEPLOY_HOOK_URL secret and the APP_URL variable (README, Deployment)."
            echo "configured=false" >> "$GITHUB_OUTPUT"
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v7
        if: steps.settings.outputs.configured == 'true'

      # The same commit dev got: calls the prod hook with ref=<this commit>, then polls /health until
      # it reports this commit (up to 10 minutes). The Rollback workflow (#27) uses the same script.
      - name: deploy this commit to prod and wait for /health
        if: steps.settings.outputs.configured == 'true'
        run: scripts/render-deploy.sh "$GITHUB_SHA"
