# CI: the same checks as the Makefile (lint, typecheck, test, build) plus the Docker image.
# Job ids are stable: the deploy job (#11) depends on them by name.
# On push to main, `deploy` runs after every other job passes and ships that commit to Render.
name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  UV_PYTHON_DOWNLOADS: automatic

jobs:
  backend:
    name: backend (lint, mypy, unit + API tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3 # setup-uv publishes no floating major tag
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - run: uv sync --locked
      - name: ruff lint
        run: uv run ruff check .
      - name: ruff format check
        run: uv run ruff format --check .
      - name: mypy
        run: uv run mypy
      - name: unit tests
        run: uv run pytest -q tests/unit
      - name: API tests
        run: uv run pytest -q tests/api

  frontend:
    name: frontend (typecheck, test, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: typecheck
        run: npm run typecheck
      - name: tests
        run: npm test
      - name: build
        run: npm run build

  integration:
    name: integration (PostgreSQL 16)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: tracker
          POSTGRES_PASSWORD: tracker
          POSTGRES_DB: tracker_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tracker -d tracker_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql+psycopg://tracker:tracker@localhost:5432/tracker_test
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3 # setup-uv publishes no floating major tag
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - run: uv sync --locked
      - name: integration tests
        run: uv run pytest -q tests/integration

  scripts:
    name: scripts (responder tests, shellcheck, actionlint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: responder and Smoke script tests
        run: scripts/responder/tests/run.sh
      - name: shellcheck
        run: shellcheck scripts/*.sh scripts/responder/*.sh scripts/responder/tests/run.sh scripts/responder/tests/fake-gh
      - name: actionlint
        run: docker run --rm -v "$PWD:/repo" -w /repo rhysd/actionlint:1.7.12 -color

  docker:
    name: docker (image build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: build image
        run: docker build --tag application-tracker:ci .

  deploy:
    name: deploy (Render)
    # Only a push to main deploys, and only after every CI job above has passed (AC-11.3, AC-11.7).
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [backend, frontend, integration, scripts, docker]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: deploy-render
      cancel-in-progress: false
    env:
      # Set by the owner (README, "Deployment"); never written into the repo (AC-11.2).
      DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
      APP_URL: ${{ vars.APP_URL }}
    steps:
      - name: check deploy settings
        id: settings
        run: |
          if [ -z "$DEPLOY_HOOK_URL" ] || [ -z "$APP_URL" ]; then
            echo "::notice title=Deploy skipped::Deployment isn't configured yet: add the RENDER_DEPLOY_HOOK_URL secret and the APP_URL variable (README, Deployment)."
            echo "configured=false" >> "$GITHUB_OUTPUT"
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v7
        if: steps.settings.outputs.configured == 'true'

      # Calls the hook with ref=<this commit>, then polls /health until it reports this commit
      # (up to 10 minutes). The Rollback workflow (#27) uses the same script.
      - name: deploy this commit and wait for /health
        if: steps.settings.outputs.configured == 'true'
        run: scripts/render-deploy.sh "$GITHUB_SHA"
