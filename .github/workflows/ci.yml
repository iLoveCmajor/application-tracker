# CI: the same checks as the Makefile (lint, typecheck, test, build) plus the Docker image.
# Job ids are stable: the deploy job (#11) depends on them by name.
# On push to main, `deploy` runs after every other job passes and ships that commit to Render.
name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  UV_PYTHON_DOWNLOADS: automatic

jobs:
  backend:
    name: backend (lint, mypy, unit + API tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3 # setup-uv publishes no floating major tag
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - run: uv sync --locked
      - name: ruff lint
        run: uv run ruff check .
      - name: ruff format check
        run: uv run ruff format --check .
      - name: mypy
        run: uv run mypy
      - name: unit tests
        run: uv run pytest -q tests/unit
      - name: API tests
        run: uv run pytest -q tests/api

  frontend:
    name: frontend (typecheck, test, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: typecheck
        run: npm run typecheck
      - name: tests
        run: npm test
      - name: build
        run: npm run build

  integration:
    name: integration (PostgreSQL 16)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: tracker
          POSTGRES_PASSWORD: tracker
          POSTGRES_DB: tracker_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tracker -d tracker_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql+psycopg://tracker:tracker@localhost:5432/tracker_test
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3 # setup-uv publishes no floating major tag
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - run: uv sync --locked
      - name: integration tests
        run: uv run pytest -q tests/integration

  docker:
    name: docker (image build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: build image
        run: docker build --tag application-tracker:ci .

  deploy:
    name: deploy (Render)
    # Only a push to main deploys, and only after every CI job above has passed (AC-11.3, AC-11.7).
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [backend, frontend, integration, docker]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: deploy-render
      cancel-in-progress: false
    env:
      # Set by the owner (README, "Deployment"); never written into the repo (AC-11.2).
      DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
      APP_URL: ${{ vars.APP_URL }}
    steps:
      - name: check deploy settings
        id: settings
        run: |
          if [ -z "$DEPLOY_HOOK_URL" ] || [ -z "$APP_URL" ]; then
            echo "::notice title=Deploy skipped::Deployment isn't configured yet: add the RENDER_DEPLOY_HOOK_URL secret and the APP_URL variable (README, Deployment)."
            echo "configured=false" >> "$GITHUB_OUTPUT"
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - name: trigger the Render deploy hook
        if: steps.settings.outputs.configured == 'true'
        run: |
          # The hook URL already carries ?key=...; ref pins the deploy to this commit.
          case "$DEPLOY_HOOK_URL" in *\?*) sep='&' ;; *) sep='?' ;; esac
          code=$(curl -sS -X POST -o response.json -w '%{http_code}' \
            "${DEPLOY_HOOK_URL}${sep}ref=${GITHUB_SHA}")
          echo "Render answered HTTP $code: $(cat response.json)"
          case "$code" in
            200|202) ;;
            *) echo "::error::The deploy hook returned HTTP $code"; exit 1 ;;
          esac

      - name: wait until /health reports this commit
        if: steps.settings.outputs.configured == 'true'
        run: |
          # Free instances sleep, and a Docker build takes a few minutes: poll for up to 10 minutes.
          url="${APP_URL%/}/health"
          deadline=$(( $(date +%s) + 600 ))
          while :; do
            version=$(curl -sS --max-time 60 "$url" | jq -r '.version // empty' 2>/dev/null || true)
            if [ "$version" = "$GITHUB_SHA" ]; then
              echo "$url reports version $version"
              exit 0
            fi
            if [ "$(date +%s)" -ge "$deadline" ]; then
              echo "::error::$url still reports version '${version:-unreachable}', expected $GITHUB_SHA after 10 minutes"
              exit 1
            fi
            echo "version '${version:-unreachable}', waiting for $GITHUB_SHA"
            sleep 15
          done
