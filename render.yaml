# Render Blueprint (https://render.com/docs/blueprint-spec): the app from the root Dockerfile, deployed
# twice (prod and dev), plus one free Render Postgres. Auto-deploy is off on both services: CI's
# `deploy-dev` job calls the dev deploy hook after every CI job on main has passed, and `deploy-prod`
# calls the prod hook after a manual approval (#11, #28).
services:
  - type: web
    name: application-tracker
    runtime: docker
    plan: free
    region: frankfurt
    branch: main
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /ready
    autoDeployTrigger: "off"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: application-tracker-db
          property: connectionString
      - key: SEED_DEMO_DATA
        value: "true"
      - key: LOG_LEVEL
        value: info
      # PORT is set by Render; the image's CMD listens on it. /health reports RENDER_GIT_COMMIT.

  # Dev (#28): same image, deployed by CI before prod. Render allows one free Postgres per account,
  # so dev shares application-tracker-db with prod (README, "Dev and prod").
  - type: web
    name: application-tracker-dev
    runtime: docker
    plan: free
    region: frankfurt
    branch: main
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /ready
    autoDeployTrigger: "off"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: application-tracker-db
          property: connectionString
      - key: SEED_DEMO_DATA
        value: "true"
      - key: LOG_LEVEL
        value: info

databases:
  - name: application-tracker-db
    plan: free
    region: frankfurt
    databaseName: tracker
    user: tracker
    postgresMajorVersion: "16"
