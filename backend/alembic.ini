# Alembic CLI config. Run from backend/, e.g.:
#   uv run alembic upgrade head
#   uv run alembic revision --autogenerate -m "add a column"
# The database comes from DATABASE_URL (default: sqlite:///./tracker.db).

[alembic]
script_location = %(here)s/src/app/db/migrations
prepend_sys_path = src
path_separator = os
file_template = %%(rev)s_%%(slug)s
