openapi: 3.1.0
info:
  title: Application Tracker API
  version: 0.1.0
  description: |
    The contract between the backend in `backend/` and the frontend client in
    `frontend/src/api/`. Behaviour and business rules are in `_docs/specs.md`;
    this file is changed first, then the code.

    **Conventions**

    - JSON over HTTP, `snake_case` fields. Requests with a body send `Content-Type: application/json`.
    - IDs are UUIDs generated by the server. Dates are `YYYY-MM-DD`; timestamps are ISO 8601 in UTC.
    - `company` and `role` are trimmed before validation and stored trimmed.
    - Request bodies reject unknown fields with `422 validation_error`.
    - A malformed id in the URL returns `404 not_found` (it can't match anything), not `422`.
    - List responses are plain JSON arrays; there is no pagination.
    - `204 No Content` responses have an empty body.
    - Every non-2xx response has an `ErrorResponse` body: `{"error": {"code", "message", "details"}}`.
      `message` is human-readable and shown as is; clients branch on `code`.
    - "Today" is the server's current date in UTC.

    **Authentication**

    None. The app is single-user (see `_docs/specs.md`, Non-goals).
servers:
  - url: /
    description: Same origin. The application endpoints are under `/api/v1`; `/health` and `/ready` are not.

security: []

tags:
  - name: health
    description: Liveness and readiness
  - name: applications
    description: Applications, their status changes and history
  - name: followups
    description: Applications due a follow-up
  - name: stats
    description: Funnel numbers

paths:
  /health:
    get:
      tags: [health]
      operationId: health
      summary: Liveness check
      description: The process is up. Does not touch the database.
      responses:
        '200':
          description: The service is up.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
        '500':
          $ref: '#/components/responses/InternalError'

  /ready:
    get:
      tags: [health]
      operationId: ready
      summary: Readiness check
      description: The database answers `SELECT 1`.
      responses:
        '200':
          description: The database answers.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ready'
        '503':
          description: The database cannot be reached (`service_unavailable`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error:
                  code: service_unavailable
                  message: Database is not reachable
                  details: {}
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/applications:
    get:
      tags: [applications]
      operationId: listApplications
      summary: List applications
      description: Ordered by `updated_at`, newest first (FR-2). Optionally filtered by one status.
      parameters:
        - name: status
          in: query
          required: false
          description: Only applications with this status.
          schema:
            $ref: '#/components/schemas/Status'
      responses:
        '200':
          description: The applications, newest `updated_at` first; `[]` when there are none.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Application'
        '422':
          $ref: '#/components/responses/ValidationError'
        '500':
          $ref: '#/components/responses/InternalError'
    post:
      tags: [applications]
      operationId: createApplication
      summary: Create an application
      description: |
        The application starts at `saved`; `status` is not accepted in the body.
        Writes the first history event (`from_status: null`, `to_status: saved`) (FR-4).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApplicationInput'
            example:
              company: '  Northwind Analytics  '
              role: ML Engineer
              link: https://jobs.example.com/northwind/ml-engineer
              source: cold
      responses:
        '201':
          description: The new application.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Application'
        '422':
          $ref: '#/components/responses/ValidationError'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/applications/{id}:
    parameters:
      - $ref: '#/components/parameters/ApplicationId'
    get:
      tags: [applications]
      operationId: getApplication
      summary: Get an application
      responses:
        '200':
          description: The application.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Application'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
    patch:
      tags: [applications]
      operationId: updateApplication
      summary: Edit an application
      description: |
        Partial update: only the fields present are changed, and `updated_at` is bumped.
        `null` clears `link`, `notes`, `applied_date` or `follow_up_date`; `null` for
        `company`, `role` or `source` is a `422`. `status` cannot be changed here
        (FR-3): sending it is a `422 validation_error`; use `POST /api/v1/applications/{id}/status`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApplicationPatch'
            example:
              notes: Recruiter asked for a portfolio link.
              follow_up_date: '2026-11-20'
      responses:
        '200':
          description: The updated application.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Application'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
        '500':
          $ref: '#/components/responses/InternalError'
    delete:
      tags: [applications]
      operationId: deleteApplication
      summary: Delete an application
      description: Also deletes its history events.
      responses:
        '204':
          description: Deleted.
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/applications/{id}/status:
    parameters:
      - $ref: '#/components/parameters/ApplicationId'
    post:
      tags: [applications]
      operationId: changeApplicationStatus
      summary: Change an application's status
      description: |
        The only way to change `status` (FR-3). Any status may move to any other; moving
        to the current status is `409 invalid_transition`. In the same transaction it writes
        a history event and applies the date rules: to `applied`, `applied_date` is set to
        today if empty and `follow_up_date` to today + 7 days (FR-5); to `offer`, `rejected`
        or `ghosted`, `follow_up_date` is cleared (FR-6). `updated_at` is bumped.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StatusChange'
            example:
              status: applied
              note: Sent through the careers page.
      responses:
        '200':
          description: The application after the change.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Application'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: The application already has this status (`invalid_transition`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error:
                  code: invalid_transition
                  message: Application is already applied
                  details:
                    status: applied
        '422':
          $ref: '#/components/responses/ValidationError'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/applications/{id}/events:
    parameters:
      - $ref: '#/components/parameters/ApplicationId'
    get:
      tags: [applications]
      operationId: listApplicationEvents
      summary: An application's status history
      description: "Oldest first. The first event is the one written on create (`from_status: null`)."
      responses:
        '200':
          description: The history.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/StatusEvent'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/followups:
    get:
      tags: [followups]
      operationId: listFollowups
      summary: Applications due a follow-up
      description: |
        Applications whose `follow_up_date` is today or earlier and whose status is
        `applied`, `screen` or `interview` (FR-7). Ordered by `follow_up_date` ascending,
        then `company`.
      responses:
        '200':
          description: The applications due a follow-up; `[]` when there are none.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Application'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/stats/funnel:
    get:
      tags: [stats]
      operationId: getFunnel
      summary: Funnel numbers
      description: |
        `by_status` is the current count for every status, zeros included. `by_source` has
        one row per source, always all three, in the order `cold`, `inbound`, `referral`
        (FR-8). An application *reached applied* if any of its events moved it to `applied`,
        `screen`, `interview` or `offer`; it *reached screen* if any event moved it to
        `screen`, `interview` or `offer`.
      responses:
        '200':
          description: The funnel.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Funnel'
        '500':
          $ref: '#/components/responses/InternalError'

components:
  parameters:
    ApplicationId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid

  schemas:
    Status:
      type: string
      enum: [saved, applied, screen, interview, offer, rejected, ghosted]

    Source:
      type: string
      enum: [cold, inbound, referral]

    Application:
      type: object
      required:
        - id
        - company
        - role
        - link
        - source
        - status
        - applied_date
        - follow_up_date
        - notes
        - created_at
        - updated_at
      properties:
        id:
          type: string
          format: uuid
        company:
          type: string
          minLength: 1
          maxLength: 100
        role:
          type: string
          minLength: 1
          maxLength: 100
        link:
          type: ['string', 'null']
          maxLength: 500
        source:
          $ref: '#/components/schemas/Source'
        status:
          $ref: '#/components/schemas/Status'
        applied_date:
          type: ['string', 'null']
          format: date
        follow_up_date:
          type: ['string', 'null']
          format: date
        notes:
          type: ['string', 'null']
          maxLength: 5000
        created_at:
          type: string
          format: date-time
        updated_at:
          description: Changes on every edit and status change.
          type: string
          format: date-time

    ApplicationInput:
      type: object
      required: [company, role, source]
      additionalProperties: false
      properties:
        company:
          description: Trimmed; must be 1–100 characters after trimming.
          type: string
          minLength: 1
          maxLength: 100
        role:
          description: Trimmed; must be 1–100 characters after trimming.
          type: string
          minLength: 1
          maxLength: 100
        link:
          description: Optional; when present must start with `http://` or `https://`.
          type: ['string', 'null']
          maxLength: 500
          pattern: '^https?://'
        source:
          $ref: '#/components/schemas/Source'
        notes:
          type: ['string', 'null']
          maxLength: 5000

    ApplicationPatch:
      type: object
      additionalProperties: false
      description: Every field is optional. `status` is not allowed (FR-3).
      properties:
        company:
          description: Trimmed; must be 1–100 characters after trimming. Cannot be `null`.
          type: string
          minLength: 1
          maxLength: 100
        role:
          description: Trimmed; must be 1–100 characters after trimming. Cannot be `null`.
          type: string
          minLength: 1
          maxLength: 100
        link:
          description: '`null` clears it; otherwise must start with `http://` or `https://`.'
          type: ['string', 'null']
          maxLength: 500
          pattern: '^https?://'
        source:
          description: Cannot be `null`.
          $ref: '#/components/schemas/Source'
        applied_date:
          description: '`null` clears it.'
          type: ['string', 'null']
          format: date
        follow_up_date:
          description: '`null` clears it.'
          type: ['string', 'null']
          format: date
        notes:
          description: '`null` clears it.'
          type: ['string', 'null']
          maxLength: 5000

    StatusChange:
      type: object
      required: [status]
      additionalProperties: false
      properties:
        status:
          $ref: '#/components/schemas/Status'
        note:
          description: Optional; stored on the history event.
          type: ['string', 'null']
          maxLength: 500

    StatusEvent:
      type: object
      required: [id, application_id, from_status, to_status, note, created_at]
      properties:
        id:
          type: string
          format: uuid
        application_id:
          type: string
          format: uuid
        from_status:
          description: '`null` for the event written on create.'
          oneOf:
            - $ref: '#/components/schemas/Status'
            - type: 'null'
        to_status:
          $ref: '#/components/schemas/Status'
        note:
          type: ['string', 'null']
          maxLength: 500
        created_at:
          type: string
          format: date-time

    SourceFunnel:
      type: object
      required: [source, applied, reached_screen, screen_rate]
      properties:
        source:
          $ref: '#/components/schemas/Source'
        applied:
          description: Applications from this source that reached `applied`.
          type: integer
          minimum: 0
        reached_screen:
          description: Applications from this source that reached `screen`.
          type: integer
          minimum: 0
        screen_rate:
          description: '`reached_screen / applied`, rounded to 3 decimals; `null` when `applied` is 0.'
          type: ['number', 'null']
          minimum: 0
          maximum: 1

    Funnel:
      type: object
      required: [total, by_status, by_source]
      properties:
        total:
          description: All applications.
          type: integer
          minimum: 0
        by_status:
          description: The current count for every status, zeros included.
          type: object
          additionalProperties: false
          required: [saved, applied, screen, interview, offer, rejected, ghosted]
          properties:
            saved:
              type: integer
              minimum: 0
            applied:
              type: integer
              minimum: 0
            screen:
              type: integer
              minimum: 0
            interview:
              type: integer
              minimum: 0
            offer:
              type: integer
              minimum: 0
            rejected:
              type: integer
              minimum: 0
            ghosted:
              type: integer
              minimum: 0
        by_source:
          description: One row per source, always all three.
          type: array
          minItems: 3
          maxItems: 3
          items:
            $ref: '#/components/schemas/SourceFunnel'

    Health:
      type: object
      required: [status, version]
      properties:
        status:
          type: string
          const: ok
        version:
          description: '`APP_VERSION` when set, else `RENDER_GIT_COMMIT` when set, else `dev`.'
          type: string

    Ready:
      type: object
      required: [status]
      properties:
        status:
          type: string
          const: ok

    ErrorCode:
      type: string
      enum:
        - validation_error
        - not_found
        - invalid_transition
        - service_unavailable
        - internal_error

    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message, details]
          properties:
            code:
              $ref: '#/components/schemas/ErrorCode'
            message:
              description: Human-readable; the frontend shows it as is.
              type: string
            details:
              description: Extra context, for example the invalid `field` or the id that was not found.
              type: object
              additionalProperties: true

  responses:
    ValidationError:
      description: The request body or a query parameter is invalid (`validation_error`).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error:
              code: validation_error
              message: Company must not be empty
              details:
                field: company
    NotFound:
      description: No application with that id, or a malformed id (`not_found`).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error:
              code: not_found
              message: Application not found
              details:
                id: 2f5543b3-7076-48bf-86f8-db9619a3d417
    InternalError:
      description: Unexpected server error (`internal_error`). Never includes a stack trace.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error:
              code: internal_error
              message: Internal server error
              details: {}
